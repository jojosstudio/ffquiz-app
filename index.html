<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FF Fragen Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      background: #2d3148;
      border: none;
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }
    .back-btn:active { background: #3d4168; }
    .header-title {
      font-size: 17px;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-subtitle {
      font-size: 12px;
      color: #64748b;
    }

    /* BREADCRUMB */
    .breadcrumb {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #13151f;
      border-bottom: 1px solid #1e2235;
    }
    .breadcrumb::-webkit-scrollbar { display: none; }
    .breadcrumb-item {
      font-size: 13px;
      color: #64748b;
      white-space: nowrap;
      cursor: pointer;
    }
    .breadcrumb-item:last-child { color: #94a3b8; }
    .breadcrumb-sep { color: #334155; font-size: 12px; }

    /* GRID */
    .grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* FOLDER CARD */
    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 14px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active { background: #22263a; transform: scale(0.97); }
    .card-icon { font-size: 32px; }
    .card-name {
      font-size: 12px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
    }
    .card-count {
      font-size: 11px;
      color: #475569;
    }
    .card.folder .card-icon { filter: drop-shadow(0 0 6px #3b82f640); }
    .card.question .card-icon { }

    /* QUIZ OVERLAY */
    .quiz-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f1117;
      z-index: 200;
      flex-direction: column;
    }
    .quiz-overlay.active { display: flex; }

    .quiz-header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .quiz-progress-bar {
      height: 3px;
      background: #2d3148;
      position: relative;
    }
    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      transition: width 0.3s;
    }

    .quiz-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.5;
    }

    .quiz-answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-btn {
      background: #1a1d27;
      border: 1.5px solid #2d3148;
      border-radius: 14px;
      padding: 16px;
      color: #cbd5e1;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .answer-btn:active { transform: scale(0.98); }
    .answer-btn.selected {
      border-color: #3b82f6;
      background: #1e3a5f;
      color: #93c5fd;
    }
    .answer-btn.correct {
      border-color: #22c55e;
      background: #14532d;
      color: #86efac;
    }
    .answer-btn.wrong {
      border-color: #ef4444;
      background: #450a0a;
      color: #fca5a5;
    }
    .answer-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2d3148;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      color: #64748b;
    }
    .answer-btn.selected .answer-letter { background: #3b82f6; color: white; }
    .answer-btn.correct .answer-letter { background: #22c55e; color: white; }
    .answer-btn.wrong .answer-letter { background: #ef4444; color: white; }

    .quiz-footer {
      padding: 16px;
      background: #1a1d27;
      border-top: 1px solid #2d3148;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .submit-btn.primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
    }
    .submit-btn.primary:disabled {
      background: #2d3148;
      color: #475569;
      cursor: not-allowed;
    }
    .submit-btn.next {
      background: #22c55e;
      color: white;
    }
    .submit-btn:active:not(:disabled) { transform: scale(0.98); }

    /* RESULT */
    .result-feedback {
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      display: none;
    }
    .result-feedback.correct {
      background: #14532d;
      color: #86efac;
      border: 1px solid #22c55e40;
      display: block;
    }
    .result-feedback.wrong {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #ef444440;
      display: block;
    }

    /* FINAL RESULT */
    .final-result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 16px;
      text-align: center;
    }
    .result-emoji { font-size: 64px; }
    .result-score {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .result-label { font-size: 16px; color: #64748b; }
    .result-details { font-size: 14px; color: #475569; }

    /* KATEGORIE TEST BTN */
    .category-test-btn {
      margin: 0 16px 16px;
      width: calc(100% - 32px);
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .category-test-btn:active { transform: scale(0.98); }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
      font-size: 15px;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <div class="header">
    <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">‹</button>
    <div>
      <div class="header-title" id="headerTitle">FF Fragen</div>
      <div class="header-subtitle" id="headerSubtitle">Wähle eine Kategorie</div>
    </div>
  </div>

  <!-- BREADCRUMB -->
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-item" onclick="navigateTo(null)">🏠 Start</span>
  </div>

  <!-- KATEGORIE TEST -->
  <button class="category-test-btn" id="categoryTestBtn" style="display:none" onclick="startCategoryTest()">
    📝 Alle Fragen dieser Kategorie testen
  </button>

  <!-- GRID -->
  <div class="grid" id="grid">
    <div class="loading">⏳ Lade Fragen...</div>
  </div>
</div>

<!-- QUIZ OVERLAY -->
<div class="quiz-overlay" id="quizOverlay">
  <div class="quiz-header">
    <button class="back-btn" onclick="closeQuiz()">✕</button>
    <div style="flex:1">
      <div class="header-title" id="quizTitle">Quiz</div>
      <div class="header-subtitle" id="quizProgress">Frage 1 von 1</div>
    </div>
  </div>
  <div class="quiz-progress-bar">
    <div class="quiz-progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="quiz-body" id="quizBody">
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-answers" id="quizAnswers"></div>
    <div class="result-feedback" id="resultFeedback"></div>
  </div>
  <div class="quiz-footer">
    <button class="submit-btn primary" id="submitBtn" onclick="submitAnswer()" disabled>Antwort prüfen</button>
  </div>
</div>

<script>
  let data = null
  let currentPath = []
  let currentItems = []
  let quizQuestions = []
  let quizIndex = 0
  let selectedAnswers = []
  let answered = false
  let score = 0

  // Lade index.json
  async function init() {
    try {
      const res = await fetch('data/index.json')
      if (!res.ok) throw new Error('index.json nicht gefunden')
      data = await res.json()
      render()
    } catch (e) {
      document.getElementById('grid').innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <div class="empty-icon">⚠️</div>
          <div>index.json nicht gefunden.<br>Bitte zuerst das Generate-Script ausführen.</div>
        </div>`
    }
  }

  function getCurrentItems() {
    if (currentPath.length === 0) return data
    let current = data
    for (const segment of currentPath) {
      const folder = current.find(i => i.name === segment && i.type === 'folder')
      if (!folder) return []
      current = folder.children || []
    }
    return current
  }

  function countQuestions(items) {
    let count = 0
    for (const item of items) {
      if (item.type === 'question') count++
      if (item.type === 'folder') count += countQuestions(item.children || [])
    }
    return count
  }

  function getAllQuestions(items) {
    let questions = []
    for (const item of items) {
      if (item.type === 'question') questions.push(item)
      if (item.type === 'folder') questions = questions.concat(getAllQuestions(item.children || []))
    }
    return questions
  }

  function render() {
    currentItems = getCurrentItems()
    const folders = currentItems.filter(i => i.type === 'folder')
    const questions = currentItems.filter(i => i.type === 'question')
    const totalQ = countQuestions(currentItems)

    // Header
    const title = currentPath.length > 0 ? currentPath[currentPath.length - 1] : 'FF Fragen'
    document.getElementById('headerTitle').textContent = title
    document.getElementById('headerSubtitle').textContent =
      `${folders.length} Ordner · ${totalQ} Fragen`
    document.getElementById('backBtn').style.display = currentPath.length > 0 ? 'flex' : 'none'

    // Breadcrumb
    let bc = `<span class="breadcrumb-item" onclick="navigateTo(null)">🏠 Start</span>`
    currentPath.forEach((seg, i) => {
      bc += `<span class="breadcrumb-sep">›</span>`
      bc += `<span class="breadcrumb-item" onclick="navigateTo(${i})">${seg}</span>`
    })
    document.getElementById('breadcrumb').innerHTML = bc

    // Kategorie Test Button
    document.getElementById('categoryTestBtn').style.display =
      currentPath.length > 0 && totalQ > 0 ? 'block' : 'none'

    // Grid
    const grid = document.getElementById('grid')
    if (currentItems.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📂</div><div>Leer</div></div>`
      return
    }

    let html = ''
    // Ordner zuerst
    for (const item of folders) {
      const q = countQuestions(item.children || [])
      html += `<div class="card folder" onclick="openFolder('${item.name.replace(/'/g, "\\'")}')">
        <div class="card-icon">📁</div>
        <div class="card-name">${item.name}</div>
        <div class="card-count">${q} Fragen</div>
      </div>`
    }
    // Dann Fragen
    for (const item of questions) {
      html += `<div class="card question" onclick="startSingleQuiz(${JSON.stringify(JSON.stringify(item))})">
        <div class="card-icon">❓</div>
        <div class="card-name">${item.text}</div>
        <div class="card-count">${item.answers?.length || 0} Antworten</div>
      </div>`
    }
    grid.innerHTML = html
  }

  function openFolder(name) {
    currentPath.push(name)
    render()
    window.scrollTo(0, 0)
  }

  function navigateTo(index) {
    if (index === null) {
      currentPath = []
    } else {
      currentPath = currentPath.slice(0, index + 1)
    }
    render()
    window.scrollTo(0, 0)
  }

  function goBack() {
    currentPath.pop()
    render()
    window.scrollTo(0, 0)
  }

  function startCategoryTest() {
    const questions = getAllQuestions(currentItems)
    // Mischen
    const shuffled = questions.sort(() => Math.random() - 0.5)
    startQuiz(shuffled, currentPath[currentPath.length - 1] || 'Quiz')
  }

  function startSingleQuiz(itemJson) {
    const item = JSON.parse(itemJson)
    startQuiz([item], item.text)
  }

  function startQuiz(questions, title) {
    quizQuestions = questions
    quizIndex = 0
    score = 0
    document.getElementById('quizTitle').textContent = title
    document.getElementById('quizOverlay').classList.add('active')
    showQuestion()
  }

  function showQuestion() {
    if (quizIndex >= quizQuestions.length) {
      showFinalResult()
      return
    }

    const q = quizQuestions[quizIndex]
    selectedAnswers = []
    answered = false

    document.getElementById('quizProgress').textContent =
      `Frage ${quizIndex + 1} von ${quizQuestions.length}`
    document.getElementById('progressFill').style.width =
      `${(quizIndex / quizQuestions.length) * 100}%`
    document.getElementById('quizQuestion').textContent = q.text
    document.getElementById('resultFeedback').className = 'result-feedback'
    document.getElementById('resultFeedback').textContent = ''

    const submitBtn = document.getElementById('submitBtn')
    submitBtn.className = 'submit-btn primary'
    submitBtn.textContent = 'Antwort prüfen'
    submitBtn.disabled = true
    submitBtn.onclick = submitAnswer

    const letters = ['A', 'B', 'C', 'D']
    let answersHtml = ''
    const answers = q.answers || []
    answers.forEach((answer, idx) => {
      answersHtml += `
        <button class="answer-btn" id="answer-${idx}" onclick="selectAnswer(${idx})">
          <span class="answer-letter">${letters[idx]}</span>
          <span>${answer}</span>
        </button>`
    })
    document.getElementById('quizAnswers').innerHTML = answersHtml

    // Scroll to top
    document.getElementById('quizBody').scrollTo(0, 0)
  }

  function selectAnswer(idx) {
    if (answered) return
    const btn = document.getElementById(`answer-${idx}`)
    if (selectedAnswers.includes(idx)) {
      selectedAnswers = selectedAnswers.filter(i => i !== idx)
      btn.classList.remove('selected')
    } else {
      selectedAnswers.push(idx)
      btn.classList.add('selected')
    }
    document.getElementById('submitBtn').disabled = selectedAnswers.length === 0
  }

  function submitAnswer() {
    if (answered) return
    answered = true

    const q = quizQuestions[quizIndex]
    const correct = q.correctAnswers || []

    const isCorrect = correct.length === selectedAnswers.length &&
      correct.every(c => selectedAnswers.includes(c))

    if (isCorrect) score++

    // Antworten einfärben
    const answers = q.answers || []
    answers.forEach((_, idx) => {
      const btn = document.getElementById(`answer-${idx}`)
      if (!btn) return
      btn.classList.remove('selected')
      if (correct.includes(idx)) {
        btn.classList.add('correct')
      } else if (selectedAnswers.includes(idx)) {
        btn.classList.add('wrong')
      }
    })

    // Feedback
    const feedback = document.getElementById('resultFeedback')
    if (isCorrect) {
      feedback.className = 'result-feedback correct'
      feedback.textContent = '✓ Richtig!'
    } else {
      const correctText = correct.map(i => answers[i]).join(', ')
      feedback.className = 'result-feedback wrong'
      feedback.textContent = `✗ Falsch — Richtig: ${correctText}`
    }

    // Button zu "Weiter"
    const submitBtn = document.getElementById('submitBtn')
    if (quizIndex + 1 < quizQuestions.length) {
      submitBtn.className = 'submit-btn next'
      submitBtn.textContent = 'Nächste Frage →'
      submitBtn.disabled = false
      submitBtn.onclick = () => { quizIndex++; showQuestion() }
    } else {
      submitBtn.className = 'submit-btn next'
      submitBtn.textContent = 'Ergebnis anzeigen'
      submitBtn.disabled = false
      submitBtn.onclick = showFinalResult
    }
  }

  function showFinalResult() {
    const total = quizQuestions.length
    const pct = Math.round((score / total) * 100)
    let emoji = pct >= 80 ? '🏆' : pct >= 60 ? '👍' : pct >= 40 ? '😅' : '💪'

    document.getElementById('progressFill').style.width = '100%'
    document.getElementById('quizProgress').textContent = 'Fertig!'

    document.getElementById('quizBody').innerHTML = `
      <div class="final-result">
        <div class="result-emoji">${emoji}</div>
        <div class="result-score">${pct}%</div>
        <div class="result-label">${score} von ${total} richtig</div>
        <div class="result-details">${pct >= 80 ? 'Sehr gut!' : pct >= 60 ? 'Gut gemacht!' : pct >= 40 ? 'Weiter üben!' : 'Nicht aufgeben!'}</div>
      </div>`

    const submitBtn = document.getElementById('submitBtn')
    submitBtn.className = 'submit-btn primary'
    submitBtn.textContent = 'Schließen'
    submitBtn.disabled = false
    submitBtn.onclick = closeQuiz
  }

  function closeQuiz() {
    document.getElementById('quizOverlay').classList.remove('active')
    document.getElementById('quizBody').innerHTML = `
      <div class="quiz-question" id="quizQuestion"></div>
      <div class="quiz-answers" id="quizAnswers"></div>
      <div class="result-feedback" id="resultFeedback"></div>`
  }

  init()
</script>
</body>
</html>
